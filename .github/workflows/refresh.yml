name: Daily paddle data refresh

on:
  schedule:
    - cron: "30 11 * * *"   # every day, 11:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (paddle thumbnails)
        run: pip install pillow

      - name: Build data
        run: |
          python build_data.py data
          rows=$(python -c "import json;print(len(json.load(open('data/paddles.json'))['rows']))")
          echo "rows=$rows"
          if [ "$rows" -lt 300 ]; then echo "Too few rows ($rows); keeping yesterday's data"; exit 1; fi
          cp data/paddles.json docs/paddles.json

      - name: Rebuild page
        run: python build_site.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/thumbs.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily paddle data refresh"
            git push
          fi
